        <p>
          <strong>Conflict Terminal</strong> is a free, real-time open-source intelligence (OSINT) dashboard that monitors
          the <strong>Iran conflict</strong>, <strong>Persian Gulf military activity</strong>, and <strong>Middle East geopolitical events</strong>.
          The platform provides an interactive live map updated every few minutes with data from multiple intelligence sources.

        <h2>Live Map Features</h2>
        <ul>
          <li><strong>Iran Airstrikes Tracker</strong> — Real-time monitoring of airstrikes, drone strikes, and missile launches in Iran and surrounding regions.</li>

          <li><strong>Satellite Fire Detection</strong> — NASA FIRMS data detecting thermal anomalies and fires that may indicate military strikes or explosions.</li>
          <li><strong>AIS Ship Tracking</strong> — Maritime vessel positions in the Persian Gulf, tracking naval movements and commercial shipping.</li>
          <li><strong>Breaking News Feed</strong> — Aggregated news from GDELT, RSS feeds, and social media about Iran conflict developments.</li>
          <li><strong>Risk Assessment Gauge</strong> — Real-time geopolitical risk score based on event frequency, severity, and source confidence.</li>
          <li><strong>Event Timeline</strong> — Chronological view of all conflict events with filtering by type: military, political, humanitarian.</li>
        </ul>

        <h2>Data Sources</h2>
        <p>
          Conflict Terminal aggregates open-source data from: <strong>NASA FIRMS</strong> (satellite fire/thermal detection),
          <strong>AIS</strong> (Automatic Identification System for maritime tracking), <strong>ADS-B</strong> (aircraft transponder data),
          <strong>GDELT</strong> (global news event database), and curated <strong>RSS news feeds</strong> covering Iran, the Persian Gulf,
          and the broader Middle East region.

        <h3>What is Conflict Terminal?</h3>
        <p>Conflict Terminal is a free OSINT dashboard providing a real-time live map of conflict events in Iran and the Persian Gulf. It aggregates satellite imagery, ship tracking, aircraft monitoring, and news data to display military strikes, political developments, and humanitarian incidents.</p>

        <h3>How does the Iran conflict live map work?</h3>
        <p>The live map ingests data from multiple open-source intelligence providers every few minutes. NASA FIRMS detects fires via satellite. AIS monitors vessels in the Persian Gulf. GDELT and RSS aggregate breaking news. Events are classified by type and plotted on the map with confidence scores.</p>

        <p>The map primarily covers Iran, Iraq, the Persian Gulf, Strait of Hormuz, Gulf of Oman, and surrounding Middle East regions. It tracks events including airstrikes, naval movements, political incidents, and humanitarian developments.</p>
